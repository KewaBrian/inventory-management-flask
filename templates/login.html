{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}

<h1 class="text-3xl font-bold mb-8 text-center">Login</h1>

<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow">

    <form method="POST">
        {{ form.hidden_tag() }}

        <!-- Username -->
        <label class="block font-medium mb-1">Username</label>
        {{ form.username(class="w-full border rounded px-3 py-2 mb-4") }}

        <!-- Password -->
        <label class="block font-medium mb-1">Password</label>
        {{ form.password(class="w-full border rounded px-3 py-2 mb-6") }}

        <!-- Button -->
        <button class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition">
            Login
        </button>
    </form>

    <p class="text-center text-gray-600 mt-4">
        Don’t have an account?
        <a href="{{ url_for('auth.register') }}" class="text-blue-600 hover:underline">Register</a>
    </p>

</div>

{% endblock %}
